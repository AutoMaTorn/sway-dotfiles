# ============================================
# Kitty Terminal Config
# ============================================

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Performance
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# Cursor
cursor_shape     beam
cursor_blink_interval 0.8

# Window
remember_window_size  no
initial_window_width  90c
initial_window_height 26c
window_padding_width  8
hide_window_decorations no
confirm_os_window_close 0

# Background opacity (sway has no blur: keep opaque)
background_opacity 1.0

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
url_color #ffffff
url_style curly

# Sounds
enable_audio_bell no
visual_bell_duration 0.0

# Shell integration
shell_integration enabled

# Theme: monochrome, matches sway/waybar
background            #181818
foreground            #E6E6E6
cursor                #d9d9d9
cursor_text_color     #181818
selection_background  #525252
selection_foreground  #EDEDED

# Neutral greys only. Every slot clears 4.5:1 against #181818 so nothing
# disappears (ANSI "black" is lifted for that reason); slots differ by lightness.

#       normal              bright
color0  #6e6e6e
color1  #b0b0b0
color2  #c4c4c4
color3  #d6d6d6
color4  #9c9c9c
color5  #bababa
color6  #cecece
color7  #e0e0e0
color8  #8a8a8a
color9  #c2c2c2
color10 #d4d4d4
color11 #e6e6e6
color12 #adadad
color13 #cbcbcb
color14 #dedede
color15 #ffffff

# Tab bar
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
active_tab_background   #d9d9d9
active_tab_foreground   #181818
inactive_tab_background #525252
inactive_tab_foreground #EDEDED

# Keybindings
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
